<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDbio - BioSlides</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js" defer></script>
<script src="js/auth.js" defer></script>

</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto max-w-6xl flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-amber-500 p-1.5 rounded text-gray-900"><i data-lucide="presentation" class="w-5 h-5"></i></div>
                <h1 class="text-lg font-black text-amber-400">CDbio • Slides</h1>
            </div>
            <a href="index.html" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg border border-gray-600 transition-colors">Voltar ao Início</a>
        </div>
    </header>

    <main class="container mx-auto max-w-6xl flex-grow p-6 mb-20 space-y-6">
        <div class="border-b border-gray-700 pb-3">
            <h2 class="text-xl font-bold text-amber-400">Materiais Teóricos Didáticos</h2>
            <p class="text-gray-400 text-xs">Estude a matéria por meio de apresentações interativas seguras hospedadas no Canva.</p>
        </div>

        <div id="container-slides" class="grid sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </main>

    <nav class="bg-gray-800 border-t border-gray-700 fixed bottom-0 left-0 right-0 z-50">
        <div class="container mx-auto max-w-6xl flex justify-around items-center text-center">
            <a href="index.html" class="flex-1 py-3 text-gray-400"><i data-lucide="home" class="w-5 h-5 mx-auto mb-0.5"></i><span class="text-[10px]">Início</span></a>
            <a href="bioquiz.html" class="flex-1 py-3 text-gray-400"><i data-lucide="award" class="w-5 h-5 mx-auto mb-0.5"></i><span class="text-[10px]">Quizzes</span></a>
            <a href="biosimuladores.html" class="flex-1 py-3 text-gray-400"><i data-lucide="flask-conical" class="w-5 h-5 mx-auto mb-0.5"></i><span class="text-[10px]">Simuladores</span></a>
            <a href="biogames.html" class="flex-1 py-3 text-gray-400"><i data-lucide="gamepad-2" class="w-5 h-5 mx-auto mb-0.5"></i><span class="text-[10px]">Jogos</span></a>
            <a href="bioslides.html" class="flex-1 py-3 text-amber-400 font-bold border-t-2 border-amber-500"><i data-lucide="presentation" class="w-5 h-5 mx-auto mb-0.5"></i><span class="text-[10px]">Slides</span></a>
        </div>
    </nav>

    <script>
        // ========================================================
        // ✍️ COMAQUI: ÁREA EDITÁVEL (MUDE SEUS LINKS DO CANVA AQUI)
        // ========================================================
        const SLIDES = [
            {
                materia: "Microbiologia e Parasitologia",
                detalhes: "Slides detalhados sobre vírus, bactérias e os principais ciclos parasitários humanos.",
                corGradient: "from-amber-600 to-amber-900",
                linkCanva: "https://www.canva.com"
            },
            {
                materia: "Citologia e Organelas",
                detalhes: "Material visual focado no estudo celular, membranas e funções de cada organela.",
                corGradient: "from-teal-600 to-teal-900",
                linkCanva: "https://www.canva.com"
            },
            {
                materia: "Ecologia Geral",
                detalhes: "Estudo de ecossistemas, biomas brasileiros, cadeias alimentares e sustentabilidade.",
                corGradient: "from-indigo-600 to-indigo-900",
                linkCanva: "https://www.canva.com"
            }
        ];

        function renderizarSlides() {
            const container = document.getElementById('container-slides');
            container.innerHTML = SLIDES.map(slide => `
                <div class="bg-gray-800 border border-gray-700 rounded-xl overflow-hidden shadow-lg flex flex-col justify-between hover:border-amber-500 transition-all">
                    <div class="h-28 bg-gradient-to-br ${slide.corGradient} p-4 flex items-end">
                        <span class="text-[10px] bg-black/50 px-2 py-0.5 rounded font-mono text-amber-300 tracking-wider uppercase">Slides Disponíveis</span>
                    </div>
                    <div class="p-4 flex-grow flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-sm text-gray-100">${slide.materia}</h3>
                            <p class="text-xs text-gray-400 mt-1 leading-relaxed">${slide.detalhes}</p>
                        </div>
                        <a href="${slide.linkCanva}" target="_blank" class="mt-4 w-full bg-amber-500 hover:bg-amber-600 text-gray-900 text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1 transition-colors">
                            Abrir Apresentação <i data-lucide="external-link" class="w-3 h-3"></i>
                        </a>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        renderizarSlides();
    </script>
</body>
</html>
