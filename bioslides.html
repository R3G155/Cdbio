<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDbio - BioSlides</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto max-w-6xl flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="img/logo.png" alt="Logo" class="h-8 object-contain">
                <h1 class="text-lg font-black text-amber-400">Slides</h1>
            </div>
            <a href="index.html" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg border border-gray-600 transition-colors">Voltar</a>
        </div>
    </header>

    <main class="container mx-auto max-w-6xl flex-grow p-6 mb-20 space-y-6">
        <div class="border-b border-gray-700 pb-3">
            <h2 class="text-xl font-bold text-amber-400">Materiais Teóricos</h2>
            <p class="text-gray-400 text-xs">Estude a matéria por meio de apresentações visuais.</p>
        </div>

        <div id="container-slides" class="grid sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </main>

    <script>
        // ========================================================
        // ✍️ ÁREA EDITÁVEL: ADICIONE A IMAGEM EM "thumb"
        // ========================================================
        const SLIDES = [
            {
                materia: "Microbiologia e Parasitologia",
                detalhes: "Estudo detalhado sobre vírus, bactérias e parasitas.",
                thumb: "img/thumb-slide1.jpg", // <-- COLOQUE A IMAGEM AQUI
                linkCanva: "https://www.canva.com"
            },
            {
                materia: "Citologia Avançada",
                detalhes: "Material focado no estudo das organelas celulares.",
                thumb: "img/thumb-slide2.jpg", // <-- COLOQUE A IMAGEM AQUI
                linkCanva: "https://www.canva.com"
            }
        ];

        function renderizarSlides() {
            const container = document.getElementById('container-slides');
            container.innerHTML = SLIDES.map(slide => `
                <div class="bg-gray-800 border border-gray-700 rounded-xl overflow-hidden shadow-lg flex flex-col hover:border-amber-500 transition-all">
                    <!-- AQUI RENDERIZA A THUMB COMO FUNDO DA DIV -->
                    <div class="h-36 bg-gray-700 bg-cover bg-center flex items-end p-3 relative" style="background-image: url('${slide.thumb}');">
                        <div class="absolute inset-0 bg-gradient-to-t from-gray-900 to-transparent"></div>
                        <span class="relative z-10 text-[10px] bg-amber-500 text-gray-900 px-2 py-0.5 rounded font-bold uppercase tracking-wider">Slide</span>
                    </div>
                    <div class="p-4 flex-grow flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-sm text-gray-100">${slide.materia}</h3>
                            <p class="text-xs text-gray-400 mt-1 leading-relaxed">${slide.detalhes}</p>
                        </div>
                        <a href="${slide.linkCanva}" target="_blank" class="mt-4 w-full bg-gray-700 hover:bg-amber-600 hover:text-gray-900 text-gray-200 text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1 transition-colors border border-gray-600">
                            Abrir Apresentação <i data-lucide="external-link" class="w-3 h-3"></i>
                        </a>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        renderizarSlides();
    </script>
</body>
</html>
