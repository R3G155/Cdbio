<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDbio - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js" defer></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-6">
        <div class="text-center space-y-3">
            <div class="mx-auto flex justify-center items-center">
                <img src="img/logo.png" alt="Logo CDbio" class="h-16 w-auto object-contain drop-shadow-lg">
            </div>
            <div>
                <h2 class="text-xl font-black text-emerald-400">Entrar no CDbio</h2>
                <p class="text-xs text-gray-400">Faça login para acessar o ecossistema e ferramentas.</p>
            </div>
        </div>

        <form class="space-y-4" onsubmit="fazerLogin(event)">
            <div>
                <label class="text-xs text-gray-400 block mb-1 font-semibold">E-mail</label>
                <input type="email" id="login-email" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition-colors">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs text-gray-400 font-semibold">Senha</label>
                    <button type="button" onclick="abrirModal()" class="text-[11px] text-emerald-400 hover:text-emerald-300 font-medium hover:underline transition-colors">Esqueceu a senha?</button>
                </div>
                <div class="relative flex items-center">
                    <input type="password" id="login-senha" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 pr-10 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition-colors">
                    <button type="button" onclick="alternarVisibilidadeSenha()" class="absolute right-3 text-gray-400 hover:text-gray-200 focus:outline-none flex items-center">
                        <i id="icone-olho" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold py-2.5 rounded-lg text-sm transition-all shadow-md active:scale-[0.98]">
                Entrar na Plataforma
            </button>
        </form>

        <div class="text-center pt-2 border-t border-gray-700/60">
            <a href="cadastro.html" class="text-xs text-gray-400 hover:text-gray-200 transition-colors">Não tem uma conta? <span class="text-emerald-400 font-bold hover:underline">Cadastre-se aqui</span></a>
        </div>
    </div>

    <div id="modal-esqueci" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity">
        <div class="bg-gray-800 border border-gray-700 w-full max-w-sm rounded-2xl p-5 space-y-4 relative shadow-2xl animate-in fade-in zoom-in-95 duration-200">
            <div>
                <h3 class="text-base font-black text-amber-400 flex items-center gap-2">
                    <i data-lucide="key-round" class="w-5 h-5"></i> Recuperar Senha
                </h3>
                <p class="text-xs text-gray-400 mt-1 leading-relaxed">Enviaremos um link seguro de redefinição diretamente para o seu e-mail cadastrado.</p>
            </div>
            <div>
                <label class="text-xs text-gray-400 block mb-1 font-semibold">E-mail Cadastrado</label>
                <input type="email" id="recuperar-email" placeholder="exemplo@email.com" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm text-gray-100 focus:outline-none focus:border-amber-400 transition-colors">
            </div>
            <div class="flex space-x-2 pt-2">
                <button type="button" onclick="fecharModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-xs py-2.5 rounded-lg font-bold text-gray-200 transition-colors">Cancelar</button>
                <button type="button" onclick="enviarEmailRecuperacao()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-gray-900 text-xs py-2.5 rounded-lg font-bold transition-colors">Enviar E-mail</button>
            </div>
        </div>
    </div>

    <script>
        // Inicializa os ícones do Lucide
        lucide.createIcons();

        // Lógica para alternar a visibilidade da senha
        function alternarVisibilidadeSenha() {
            const campoSenha = document.getElementById('login-senha');
            const iconeOlho = document.getElementById('icone-olho');
            
            if (campoSenha.type === 'password') {
                campoSenha.type = 'text';
                iconeOlho.setAttribute('data-lucide', 'eye-off');
            } else {
                campoSenha.type = 'password';
                iconeOlho.setAttribute('data-lucide', 'eye');
            }
            // Força o Lucide a redesenhar o ícone alterado (de eye para eye-off ou vice-versa)
            lucide.createIcons();
        }

        // Autenticação com Firebase Auth
        function fazerLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;

            firebase.auth().signInWithEmailAndPassword(email, senha)
                .then((userCredential) => {
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    console.error(error);
                    alert("Erro ao entrar: Verifique se suas credenciais estão corretas ou se a conta existe.");
                });
        }

        // Controle de visibilidade do Modal
        function abrirModal() {
            document.getElementById('modal-esqueci').classList.remove('hidden');
        }
        function fecharModal() {
            document.getElementById('modal-esqueci').classList.add('hidden');
            document.getElementById('recuperar-email').value = '';
        }

        // Link de redefinição de senha real via Firebase
        function enviarEmailRecuperacao() {
            const email = document.getElementById('recuperar-email').value.trim();
            if (!email) {
                alert("Por favor, preencha o campo de e-mail.");
                return;
            }

            firebase.auth().sendPasswordResetEmail(email)
                .then(() => {
                    alert("E-mail de redefinição enviado! Confira sua caixa de entrada ou pasta de spam.");
                    fecharModal();
                })
                .catch((error) => {
                    console.error(error);
                    alert("Erro ao enviar: Certifique-se de que o e-mail inserido está correto.");
                });
        }
    </script>
</body>
</html>
