<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDbio - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js" defer></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="mx-auto w-12 h-12 bg-emerald-500 rounded-xl flex items-center justify-center text-gray-900 font-bold">
                <i data-lucide="lock" class="w-6 h-6"></i>
            </div>
            <h2 class="text-xl font-black text-emerald-400">Entrar no CDbio</h2>
            <p class="text-xs text-gray-400">Faça login para acessar a plataforma.</p>
        </div>

        <form class="space-y-4" onsubmit="fazerLogin(event)">
            <div>
                <label class="text-xs text-gray-400 block mb-1 font-semibold">E-mail</label>
                <input type="email" id="login-email" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs text-gray-400 font-semibold">Senha</label>
                    <button type="button" onclick="abrirModal()" class="text-[11px] text-emerald-400 hover:underline">Esqueceu a senha?</button>
                </div>
                <input type="password" id="login-senha" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold py-2.5 rounded-lg text-sm transition-all shadow-md">
                Entrar na Plataforma
            </button>
        </form>

        <div class="text-center">
            <a href="cadastro.html" class="text-xs text-gray-400 hover:text-white">Não tem conta? <span class="text-emerald-400 font-bold hover:underline">Cadastre-se aqui</span></a>
        </div>
    </div>

    <div id="modal-esqueci" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 border border-gray-700 w-full max-w-sm rounded-2xl p-5 space-y-4 relative shadow-2xl">
            <div>
                <h3 class="text-base font-black text-amber-400">Recuperar Senha</h3>
                <p class="text-xs text-gray-400 mt-0.5">Enviaremos um link de redefinição para o seu e-mail.</p>
            </div>
            <div>
                <label class="text-xs text-gray-400 block mb-1 font-semibold">Digite seu E-mail cadastrado</label>
                <input type="email" id="recuperar-email" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2 text-sm focus:outline-none focus:border-amber-400">
            </div>
            <div class="flex space-x-2">
                <button type="button" onclick="fecharModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded-lg font-bold">Cancelar</button>
                <button type="button" onclick="enviarEmailRecuperacao()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-gray-900 text-xs py-2 rounded-lg font-bold">Enviar E-mail</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Lógica de Login Real com Firebase
        function fazerLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;

            firebase.auth().signInWithEmailAndPassword(email, senha)
                .then((userCredential) => {
                    // Login efetuado com sucesso -> vai para o painel principal
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("Erro ao entrar: " + error.message);
                });
        }

        // Funções do Modal de Esqueci minha senha
        function abrirModal() {
            document.getElementById('modal-esqueci').classList.remove('hidden');
        }
        function fecharModal() {
            document.getElementById('modal-esqueci').classList.add('hidden');
        }

        // Enviar e-mail de recuperação real pelo Firebase
        function enviarEmailRecuperacao() {
            const email = document.getElementById('recuperar-email').value;
            if (!email) {
                alert("Por favor, digite seu e-mail primeiro.");
                return;
            }

            firebase.auth().sendPasswordResetEmail(email)
                .then(() => {
                    alert("E-mail de redefinição enviado! Verifique sua caixa de entrada ou spam.");
                    fecharModal();
                })
                .catch((error) => {
                    alert("Erro ao enviar e-mail: " + error.message);
                });
        }
    </script>
</body>
</html>
