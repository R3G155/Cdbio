<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDbio - BioSimuladores</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js" defer></script>
<script src="js/auth.js" defer></script>

</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto max-w-6xl flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-emerald-500 p-1.5 rounded text-gray-900"><i data-lucide="flask-conical" class="w-5 h-5"></i></div>
                <h1 class="text-lg font-black text-emerald-400">CDbio • Simuladores</h1>
            </div>
            <a href="index.html" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg border border-gray-600 transition-colors">Voltar ao Início</a>
        </div>
    </header>

    <main class="container mx-auto max-w-6xl flex-grow p-6 mb-20 space-y-6">
        <div class="border-b border-gray-700 pb-3">
            <h2 class="text-xl font-bold text-emerald-400">Laboratório Virtual Integrado</h2>
            <p class="text-gray-400 text-xs">Selecione um card abaixo para abrir as ferramentas de simulação científica do PhET Colorado.</p>
        </div>

        <div id="container-simuladores" class="grid sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </main>

    <nav class="bg-gray-800 border-t border-gray-700 fixed bottom-0 left-0 right-0 z-50">
        <div class="container mx-auto max-w-6xl flex justify-around items-center text-center">
            <a href="index.html" class="flex-1 py-3 text-gray-400"><i data-lucide="home" class="w-5 h-5 mx-auto mb-0.5"></i><span class="text-[10px]">Início</span></a>
            <a href="bioquiz.html" class="flex-1 py-3 text-gray-400"><i data-lucide="award" class="w-5 h-5 mx-auto mb-0.5"></i><span class="text-[10px]">Quizzes</span></a>
            <a href="biosimuladores.html" class="flex-1 py-3 text-emerald-400 font-bold border-t-2 border-emerald-500"><i data-lucide="flask-conical" class="w-5 h-5 mx-auto mb-0.5"></i><span class="text-[10px]">Simuladores</span></a>
            <a href="biogames.html" class="flex-1 py-3 text-gray-400"><i data-lucide="gamepad-2" class="w-5 h-5 mx-auto mb-0.5"></i><span class="text-[10px]">Jogos</span></a>
            <a href="bioslides.html" class="flex-1 py-3 text-gray-400"><i data-lucide="presentation" class="w-5 h-5 mx-auto mb-0.5"></i><span class="text-[10px]">Slides</span></a>
        </div>
    </nav>

    <script>
        // ========================================================
        // ✍️ COMAQUI: ÁREA EDITÁVEL (SEU BANCO DE DADOS LOCAL)
        // Você pode mudar os textos, ícones e links aqui embaixo:
        // ========================================================
        const SIMULADORES = [
            {
                titulo: "Expressão Gênica",
                descricao: "Explore a transcrição e tradução do DNA de forma visual e interativa em HTML5.",
                emoji: "🧬",
                link: "https://phet.colorado.edu/pt_BR/simulations/gene-expression-essentials/about"
            },
            {
                titulo: "Seleção Natural",
                descricao: "Simule gerações de organismos e veja como as pressões ambientais afetam a evolução.",
                emoji: "🐰",
                link: "https://phet.colorado.edu/pt_BR/simulations/natural-selection"
            },
            {
                titulo: "Neurônios e Sinapses",
                descricao: "Estimule um neurônio e observe o potencial de ação se propagando eletricamente.",
                emoji: "🧠",
                link: "https://phet.colorado.edu/pt_BR/simulations/neuron"
            }
        ];

        // Função que desenha os cards na tela usando a lista acima
        function renderizarSimuladores() {
            const container = document.getElementById('container-simuladores');
            container.innerHTML = SIMULADORES.map(sim => `
                <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 shadow-lg flex flex-col justify-between hover:border-emerald-500 transition-all">
                    <div>
                        <div class="text-3xl mb-2">${sim.emoji}</div>
                        <h3 class="font-bold text-sm text-gray-200">${sim.titulo}</h3>
                        <p class="text-xs text-gray-400 mt-1 leading-relaxed">${sim.descricao}</p>
                    </div>
                    <a href="${sim.link}" target="_blank" class="mt-4 text-center bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1 transition-colors">
                        Começar Simulação <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                    </a>
                </div>
            `).join('');
            lucide.createIcons();
        }

        renderizarSimuladores();
    </script>
</body>
</html>
