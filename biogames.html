<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDbio - BioJogos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto max-w-6xl flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="img/logo.png" alt="Logo CDbio" class="h-8 w-auto object-contain">
                <h1 class="text-lg font-black text-purple-400">BioJogos</h1>
            </div>
            <a href="index.html" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg border border-gray-600 transition-colors">Voltar</a>
        </div>
    </header>

    <main class="container mx-auto max-w-6xl flex-grow p-6 mb-24 space-y-6">
        <div class="border-b border-gray-700 pb-3">
            <h2 class="text-xl font-bold text-purple-400">Ambiente de Aprendizado Gamificado</h2>
            <p class="text-gray-400 text-xs">Clique no botão do card para carregar e iniciar o jogo diretamente.</p>
        </div>

        <div id="container-jogos" class="grid sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </main>

    <nav class="bg-gray-800 border-t border-gray-700 fixed bottom-0 left-0 right-0 z-50">
        <div class="container mx-auto max-w-6xl flex justify-around items-center text-center">
            <a href="index.html" class="flex-1 py-3 text-gray-400 hover:text-emerald-400 flex flex-col items-center justify-center hover:bg-gray-700/50 transition-colors">
                <i data-lucide="home" class="w-5 h-5 mb-0.5"></i><span class="text-[10px]">Início</span>
            </a>
            <a href="bioquiz.html" class="flex-1 py-3 text-gray-400 hover:text-blue-400 flex flex-col items-center justify-center hover:bg-gray-700/50 transition-colors">
                <i data-lucide="award" class="w-5 h-5 mb-0.5"></i><span class="text-[10px]">Quizzes</span>
            </a>
            <a href="biosimuladores.html" class="flex-1 py-3 text-gray-400 hover:text-emerald-400 flex flex-col items-center justify-center hover:bg-gray-700/50 transition-colors">
                <i data-lucide="flask-conical" class="w-5 h-5 mb-0.5"></i><span class="text-[10px]">Simuladores</span>
            </a>
            <a href="biogames.html" class="flex-1 py-3 text-purple-400 font-bold border-t-2 border-purple-500 flex flex-col items-center justify-center hover:bg-gray-700/50 transition-colors">
                <i data-lucide="gamepad-2" class="w-5 h-5 mb-0.5"></i><span class="text-[10px]">Jogos</span>
            </a>
            <a href="bioslides.html" class="flex-1 py-3 text-gray-400 hover:text-amber-400 flex flex-col items-center justify-center hover:bg-gray-700/50 transition-colors">
                <i data-lucide="presentation" class="w-5 h-5 mb-0.5"></i><span class="text-[10px]">Slides</span>
            </a>
        </div>
    </nav>

    <script>
        // ========================================================
        // ✍️ ÁREA EDITÁVEL (MODIFIQUE OS JOGOS AQUI)
        // ========================================================
        const JOGOS = [
            {
                titulo: "Diagrama da céluala animal",
                descricao: "Atividade interativa online com um diagrama da célula animal",
                emoji: "🧫",
                link: "https://www.coquinhos.com/diagrama-da-celula-animal/play/"
            },
            {
                titulo: "Diagrama da célula vegetal",
                descricao: "Atividade interativa on-line com um diagrama da célula vegetal",
                emoji: "🔬",
                link: "https://www.coquinhos.com/diagrama-da-celula-vegetal/play/"
            },
            {
                titulo: "Anatomia Humana Básica",
                descricao: "Encontre e nomeie os ossos importantes do corpo humano.",
                emoji: "🦴",
                link: "https://www.coquinhos.com/nomear-os-ossos-do-corpo/play/"
            }
        ];

        function renderizarJogos() {
            const container = document.getElementById('container-jogos');
            container.innerHTML = JOGOS.map(jogo => `
                <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 shadow-lg flex flex-col justify-between hover:border-purple-500 transition-all">
                    <div>
                        <div class="text-3xl mb-2">${jogo.emoji}</div>
                        <h3 class="font-bold text-sm text-gray-200">${jogo.titulo}</h3>
                        <p class="text-xs text-gray-400 mt-1 leading-relaxed">${jogo.descricao}</p>
                    </div>
                    <a href="${jogo.link}" target="_blank" class="mt-4 text-center bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1 transition-colors">
                        Jogar Agora <i data-lucide="play" class="w-3.5 h-3.5"></i>
                    </a>
                </div>
            `).join('');
            lucide.createIcons();
        }

        renderizarJogos();
    </script>
</body>
</html>
