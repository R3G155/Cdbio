<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDbio - Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js" defer></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- CARD DE CADASTRO -->
    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-6">
        <div class="text-center space-y-3">
            <!-- LOGO OFICIAL CDBIO -->
            <div class="mx-auto flex justify-center items-center">
                <img src="img/logo.png" alt="Logo CDbio" class="h-16 w-auto object-contain drop-shadow-lg">
            </div>
            <div>
                <h2 class="text-xl font-black text-blue-400">Criar Nova Conta</h2>
                <p class="text-xs text-gray-400">Cadastre-se para começar a explorar a plataforma.</p>
            </div>
        </div>

        <!-- FORMULÁRIO -->
        <form class="space-y-4" onsubmit="criarConta(event)">
            <div>
                <label class="text-xs text-gray-400 block mb-1 font-semibold">E-mail</label>
                <input type="email" id="cadastro-email" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <div>
                <label class="text-xs text-gray-400 block mb-1 font-semibold">Escolha uma Senha (mínimo 6 dígitos)</label>
                <!-- CAMPO DE SENHA COM BOTÃO DE VER/OCULTAR -->
                <div class="relative flex items-center">
                    <input type="password" id="cadastro-senha" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 pr-10 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors">
                    <button type="button" onclick="alternarVisibilidadeSenha()" class="absolute right-3 text-gray-400 hover:text-gray-200 focus:outline-none flex items-center">
                        <i id="icone-olho" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition-all shadow-md active:scale-[0.98]">
                Registrar e Criar Conta
            </button>
        </form>

        <div class="text-center pt-2 border-t border-gray-700/60">
            <a href="login.html" class="text-xs text-gray-400 hover:text-gray-200 transition-colors">Já tem uma conta? <span class="text-blue-400 font-bold hover:underline">Faça login</span></a>
        </div>
    </div>

    <script>
        // Inicializa os ícones do Lucide
        lucide.createIcons();

        // Lógica para alternar a visibilidade da senha
        function alternarVisibilidadeSenha() {
            const campoSenha = document.getElementById('cadastro-senha');
            const iconeOlho = document.getElementById('icone-olho');
            
            if (campoSenha.type === 'password') {
                campoSenha.type = 'text';
                iconeOlho.setAttribute('data-lucide', 'eye-off');
            } else {
                campoSenha.type = 'password';
                iconeOlho.setAttribute('data-lucide', 'eye');
            }
            // Força o Lucide a redesenhar o ícone alterado
            lucide.createIcons();
        }

        // Lógica de Cadastro Real com Firebase
        function criarConta(event) {
            event.preventDefault();
            const email = document.getElementById('cadastro-email').value.trim();
            const senha = document.getElementById('cadastro-senha').value;

            if (senha.length < 6) {
                alert("A senha precisa ter pelo menos 6 caracteres por segurança.");
                return;
            }

            firebase.auth().createUserWithEmailAndPassword(email, senha)
                .then((userCredential) => {
                    alert("Conta criada com sucesso! Você será redirecionado para o painel principal.");
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    console.error(error);
                    alert("Erro ao criar conta: " + error.message);
                });
        }
    </script>
</body>
</html>
