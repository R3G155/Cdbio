<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDbio - Cadastro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js" defer></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="mx-auto w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center text-gray-900 font-bold">
                <i data-lucide="user-plus" class="w-6 h-6"></i>
            </div>
            <h2 class="text-xl font-black text-blue-400">Criar Nova Conta</h2>
            <p class="text-xs text-gray-400">Cadastre-se para começar a pontuar.</p>
        </div>

        <form class="space-y-4" onsubmit="criarConta(event)">
            <div>
                <label class="text-xs text-gray-400 block mb-1 font-semibold">E-mail</label>
                <input type="email" id="cadastro-email" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-gray-400 block mb-1 font-semibold">Escolha uma Senha (mínimo 6 dígitos)</label>
                <input type="password" id="cadastro-senha" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-gray-900 font-bold py-2.5 rounded-lg text-sm transition-all shadow-md">
                Registrar e Criar Conta
            </button>
        </form>

        <div class="text-center">
            <a href="login.html" class="text-xs text-gray-400 hover:text-white">Já tem uma conta? <span class="text-blue-400 font-bold hover:underline">Faça login</span></a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function criarConta(event) {
            event.preventDefault();
            const email = document.getElementById('cadastro-email').value;
            const senha = document.getElementById('cadastro-senha').value;

            if (senha.length < 6) {
                alert("A senha precisa ter pelo menos 6 caracteres por segurança.");
                return;
            }

            firebase.auth().createUserWithEmailAndPassword(email, senha)
                .then((userCredential) => {
                    alert("Conta criada com sucesso! Você será redirecionado para o painel.");
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("Erro ao criar conta: " + error.message);
                });
        }
    </script>
</body>
</html>
